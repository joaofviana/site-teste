<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sther ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Corações flutuando no fundo */
        .heart {
            position: absolute;
            font-size: 24px;
            color: #ff4d6d;
            animation: float 6s ease-in-out infinite;
            opacity: 0.7;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(255, 77, 109, 0.25);
            text-align: center;
            position: relative;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .emoji-big {
            font-size: 4.5rem;
            margin-bottom: 15px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        h1 {
            color: #e63946;
            font-size: 1.7rem;
            line-height: 1.4;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            position: relative;
            min-height: 80px;
        }

        .btn {
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff4d6d, #e63946);
            color: white;
        }

        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 25px rgba(230, 57, 70, 0.4);
        }

        .btn-no {
            background: #adb5bd;
            color: white;
            position: absolute;
            transition: all 0.15s ease;
            user-select: none;
        }

        /* Tela de resposta positiva */
        .response {
            display: none;
            animation: fadeIn 0.6s ease;
        }

        .response.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .response h2 {
            color: #e63946;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .response p {
            color: #555;
            font-size: 1.25rem;
            line-height: 1.6;
        }

        .question-area.hide {
            display: none;
        }

        .hearts-burst {
            font-size: 2.5rem;
            margin-top: 25px;
            letter-spacing: 8px;
        }
    </style>
</head>
<body>
    <!-- Corações no fundo -->
    <div id="hearts-container"></div>

    <div class="container">
        <div class="question-area" id="questionArea">
            <div class="emoji-big">💖</div>
            <h1>Sther, você quer sair comigo próxima semana pra tomar um café muito bom no seu trabalho?</h1>
            
            <div class="buttons">
                <button class="btn btn-yes" onclick="yesClicked()">Sim ❤️</button>
                <button class="btn btn-no" id="noBtn">Não</button>
            </div>
        </div>

        <div class="response" id="responseArea">
            <div class="emoji-big">🥰</div>
            <h2>Boa escolha!</h2>
            <p>Prometo um Matcha e uma boa conversa ☕💚</p>
            <div class="hearts-burst">💕 💖 💗 💓 💞</div>
        </div>
    </div>

    <script>
        // Criar corações flutuantes
        function createHearts() {
            const container = document.getElementById('hearts-container');
            for (let i = 0; i < 25; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = ['❤️', '💖', '💗', '💕', '💓'][Math.floor(Math.random() * 5)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (4 + Math.random() * 6) + 's';
                heart.style.animationDelay = Math.random() * 8 + 's';
                heart.style.fontSize = (16 + Math.random() * 20) + 'px';
                container.appendChild(heart);
            }
        }

        createHearts();

        // Botão "Não" foge do mouse / toque
        const noBtn = document.getElementById('noBtn');

        function moveNoButton() {
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            
            // Área segura dentro do container
            const maxX = containerRect.width - noBtn.offsetWidth - 20;
            const maxY = containerRect.height - noBtn.offsetHeight - 20;
            
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.position = 'absolute';
        }

        // Desktop: mouseover
        noBtn.addEventListener('mouseover', moveNoButton);

        // Mobile: touchstart
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveNoButton();
        });

        // Também foge se clicar (por precaução)
        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            moveNoButton();
        });

        function yesClicked() {
            document.getElementById('questionArea').classList.add('hide');
            document.getElementById('responseArea').classList.add('show');
            
            // Explosão de corações extras
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = '💖';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = '3s';
                    heart.style.fontSize = '30px';
                    document.getElementById('hearts-container').appendChild(heart);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
